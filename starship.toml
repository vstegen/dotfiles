## quiet prompt
##
## Renders as:
##
##   ~/src/project main >
##
## The only real accent is the prompt character, which turns from teal to
## brick when the previous command failed. Everything the prompt could tell
## you but you can ask for instead — language versions, execution time, k8s
## context, package version — is deliberately absent.

"$schema" = "https://starship.rs/config-schema.json"

format = "$directory$git_branch$git_status$character"
right_format = ""
add_newline = true
command_timeout = 3000
palette = "quiet"

[palettes.quiet]
text = "#c5c9c5"
muted = "#707a73"
accent = "#69a6a0"
danger = "#b76d68"
mode = "#c2ad72"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "text"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false
read_only = " ro"
read_only_style = "muted"

[git_branch]
symbol = ""
format = "[$branch]($style) "
style = "muted"
truncation_length = 24
truncation_symbol = "…"

# one dim glyph per fact, no colour coding per file state
[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "muted"
conflicted = "!"
ahead = "↑"
behind = "↓"
diverged = "↕"
up_to_date = ""
untracked = ""
stashed = ""
modified = "*"
staged = "+"
renamed = ""
deleted = ""

[character]
success_symbol = "[>](accent)"
error_symbol = "[>](danger)"
vicmd_symbol = "[<](mode)"
