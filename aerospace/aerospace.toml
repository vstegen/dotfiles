after-login-command = []

after-startup-command = [
    'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0',
]

start-at-login = false
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

# Floating exceptions
[[on-window-detected]]
if.app-id = 'com.apple.FaceTime'
run = 'layout floating'

# Minimal dev-centric workspace routing
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'company.thebrowser.Browser'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.todesktop.230313mzl4w4u92'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace 9'

[mode.main.binding]
# Hyper (cmd+alt+ctrl+shift) primary navigation
cmd-alt-ctrl-shift-h = 'focus left'
cmd-alt-ctrl-shift-j = 'focus down'
cmd-alt-ctrl-shift-k = 'focus up'
cmd-alt-ctrl-shift-l = 'focus right'

# Hyper move cluster
cmd-alt-ctrl-shift-u = 'move left'
cmd-alt-ctrl-shift-i = 'move down'
cmd-alt-ctrl-shift-o = 'move up'
cmd-alt-ctrl-shift-p = 'move right'

# Layout / state
cmd-alt-ctrl-shift-slash = 'layout tiles horizontal vertical'
cmd-alt-ctrl-shift-comma = 'layout accordion horizontal vertical'
cmd-alt-ctrl-shift-f = 'fullscreen'
cmd-alt-ctrl-shift-backspace = 'flatten-workspace-tree'

# Resize
cmd-alt-ctrl-shift-n = 'resize height -50'
cmd-alt-ctrl-shift-m = 'resize height +50'
cmd-alt-ctrl-shift-semicolon = 'resize width -50'
cmd-alt-ctrl-shift-period = 'resize width +50'

# Workspaces
cmd-alt-ctrl-shift-1 = 'workspace 1'
cmd-alt-ctrl-shift-2 = 'workspace 2'
cmd-alt-ctrl-shift-3 = 'workspace 3'
cmd-alt-ctrl-shift-4 = 'workspace 4'
cmd-alt-ctrl-shift-5 = 'workspace 5'
cmd-alt-ctrl-shift-6 = 'workspace 6'
cmd-alt-ctrl-shift-7 = 'workspace 7'
cmd-alt-ctrl-shift-8 = 'workspace 8'
cmd-alt-ctrl-shift-9 = 'workspace 9'

# Move focused window to workspace via F-layer
cmd-alt-ctrl-shift-f1 = 'move-node-to-workspace 1'
cmd-alt-ctrl-shift-f2 = 'move-node-to-workspace 2'
cmd-alt-ctrl-shift-f3 = 'move-node-to-workspace 3'
cmd-alt-ctrl-shift-f4 = 'move-node-to-workspace 4'
cmd-alt-ctrl-shift-f5 = 'move-node-to-workspace 5'
cmd-alt-ctrl-shift-f6 = 'move-node-to-workspace 6'
cmd-alt-ctrl-shift-f7 = 'move-node-to-workspace 7'
cmd-alt-ctrl-shift-f8 = 'move-node-to-workspace 8'
cmd-alt-ctrl-shift-f9 = 'move-node-to-workspace 9'

cmd-alt-ctrl-shift-tab = 'workspace-back-and-forth'
cmd-alt-ctrl-shift-backtick = 'workspace-back-and-forth'
cmd-alt-ctrl-shift-space = 'mode service'

# Essential compatibility with Corne window layer (ctrl+alt)
ctrl-alt-left = 'focus left'
ctrl-alt-right = 'focus right'
ctrl-alt-u = 'move left'
ctrl-alt-i = 'move up'
ctrl-alt-j = 'move down'
ctrl-alt-k = 'move right'
ctrl-alt-enter = 'fullscreen'
ctrl-alt-backspace = 'layout floating tiling'

[mode.service.binding]
esc = 'mode main'
r = ['reload-config', 'mode main']
f = ['layout floating tiling', 'mode main']
