# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @logging-path "~/.tmux/logs/"

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'

set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_tabs_enabled on

# bind prefix to ctrl+a because ctrl+b is a vim keymap
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# scroll history of 100,000 lines
set-option -g history-limit 100000

# numbering starts at 1
set -g base-index 1
setw -g pane-base-index 1

# automatically renumber windows
set -g renumber-windows on

# Rather than constraining window size to the maximum size of any client 
# connected to the *session*, constrain window size to the maximum size of any 
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",screen-256color:Tc"

# this removes the delay when pressing <esc> in nvim
set -sg escape-time 0

# enable mouse
setw -g mouse on

# vim mode
setw -g mode-keys vi

# copy mode improvements
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Move between panes with vi keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# jump to marked pane with `
bind \` switch-client -t'{marked}'

# swap windows around with < and >
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# use current path when creating a new window
bind c new-window -c "#{pane_current_path}"

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# toggle between last used window
bind Space last-window

# toggle between last sessions
bind-key C-a switch-client -l

# resize window with Alt + j/k/h/l
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5

# switch between windows via Shift Alt vim keys
bind -n M-H previous-window
bind -n M-L next-window

# create a horizontal split and open a notes.md file
# bind-key h split-window -h "nvim ~/scratch/notes.md"

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off
  
