# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @logging-path "~/.tmux/logs/"

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'christoomey/vim-tmux-navigator'

# bind prefix to ctrl+a because ctrl+b is a vim keymap
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# scroll history of 100,000 lines
set-option -g history-limit 100000

# numbering starts at 1
set -g base-index 1
setw -g pane-base-index 1

# automatically renumber windows
set -g renumber-windows on

# Rather than constraining window size to the maximum size of any client 
# connected to the *session*, constrain window size to the maximum size of any 
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc"
set -as terminal-features ",*:RGB"

# this removes the delay when pressing <esc> in nvim
set -sg escape-time 0

# enable mouse
setw -g mouse on

# vim mode
setw -g mode-keys vi

# copy mode improvements
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Move between panes with vi keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# jump to marked pane with `
bind \` switch-client -t'{marked}'

# swap windows around with < and >
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# use current path when creating a new window
bind c new-window -c "#{pane_current_path}"

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# toggle between last used window
bind Space last-window

# toggle between last sessions
bind-key C-a switch-client -l

# resize window with Alt + j/k/h/l
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-h resize-pane -L 5
bind -r M-l resize-pane -R 5

# switch between windows via Shift Alt vim keys
bind -n M-H previous-window
bind -n M-L next-window

# create a horizontal split and open a notes.md file
# bind-key h split-window -h "nvim ~/scratch/notes.md"

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# ── quiet theme ───────────────────────────────────────────────────────────────
# Same palette as Ghostty and Neovim. The status line is chrome, so it sits at
# comment brightness; only the current window rises to normal foreground.
set -g status-style "bg=#171b18,fg=#707a73"
set -g status-justify "left"
set -g status-left-length 40
set -g status-right-length 40
set -g status-left "#[fg=#424944]#S #[default]"
set -g status-right "#[fg=#424944]%H:%M"

setw -g window-status-separator ""
setw -g window-status-style "fg=#707a73,bg=#171b18"
setw -g window-status-format " #I:#W "
setw -g window-status-current-style "fg=#e1e3df,bg=#171b18"
setw -g window-status-current-format " #I:#W "
setw -g window-status-activity-style "fg=#b09a63,bg=#171b18"
setw -g window-status-bell-style "fg=#c2726b,bg=#171b18"

set -g pane-border-style "fg=#2a302c"
set -g pane-active-border-style "fg=#424944"
set -g pane-border-lines single

set -g message-style "fg=#c5c9c5,bg=#171b18"
set -g message-command-style "fg=#c5c9c5,bg=#171b18"

# copy mode selection and matches are live state: keep them obvious
set -g mode-style "fg=#e1e3df,bg=#2f3a35"
set -g copy-mode-match-style "fg=#e8e4d6,bg=#413c2b"
set -g copy-mode-current-match-style "fg=#141712,bg=#c2ad72"

set -g display-panes-colour "#424944"
set -g display-panes-active-colour "#c2ad72"
set -g clock-mode-colour "#69a6a0"

run '~/.tmux/plugins/tpm/tpm'
